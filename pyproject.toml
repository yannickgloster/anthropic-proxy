[project]
name = "anthropic-proxy"
version = "0.1.0"
description = "Local HTTPS proxy that forwards to api.anthropic.com, for testing custom CA / custom endpoint flow"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "cryptography>=42",
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
proxy = "main:cli"

[tool.uv]
package = false
